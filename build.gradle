buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0"
group= "roger.Ophidia"
archivesBaseName = "Ophidia"

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_20"
}

repositories {
    mavenCentral()
}

dependencies {
    // Use compile instead of implementation for ForgeGradle 2.1
    compile 'org.java-websocket:Java-WebSocket:1.5.3'
}

// Fix: Modified jar task to properly include dependencies
jar {
    from {
        configurations.compile.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Make sure to correctly exclude META-INF files
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    // Important: Make the manifest explicit to avoid conflicts
    manifest {
        attributes(
                'Manifest-Version': '1.0',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }

    // This is important for handling duplicates from dependencies
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}